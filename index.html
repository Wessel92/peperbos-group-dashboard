<title>Peperbos Group Dashboard</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1117;color:#e5e7eb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:16px}
.header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid #2d3139;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.header h1{color:#10b981;font-size:24px}
.header .updated{color:#9ca3af;font-size:12px}
.tab-bar{display:flex;gap:4px;border-bottom:1px solid #2d3139;padding:0 16px;margin-bottom:20px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab-bar::-webkit-scrollbar{height:3px}
.tab-bar::-webkit-scrollbar-thumb{background:#2d3139;border-radius:3px}
.tab-btn{background:none;border:none;color:#9ca3af;padding:10px 16px;cursor:pointer;font-size:13px;border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0}
.tab-btn:hover{color:#e5e7eb}
.tab-btn.active{color:#10b981;border-bottom-color:#10b981}
.tab-content{display:none}
.tab-content.active{display:block}
.card{background:#1a1d29;border:1px solid #2d3139;border-radius:10px;padding:20px;margin-bottom:16px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.kpi{background:#1a1d29;border:1px solid #2d3139;border-radius:10px;padding:16px;cursor:pointer;transition:border-color 0.2s}
.kpi:hover{border-color:#10b981}
.kpi .label{color:#9ca3af;font-size:12px;margin-bottom:4px}
.kpi .value{font-size:22px;font-weight:700;color:#e5e7eb}
.kpi .value.green{color:#10b981}
.kpi .value.red{color:#ef4444}
.chart-box{background:#1a1d29;border:1px solid #2d3139;border-radius:10px;padding:20px;margin-bottom:16px;position:relative;min-height:280px}
.chart-box h3{color:#e5e7eb;font-size:14px;margin-bottom:12px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#141720;color:#9ca3af;padding:10px 12px;text-align:left;border-bottom:1px solid #2d3139;position:sticky;top:0}
td{padding:8px 12px;border-bottom:1px solid #1e2230;color:#e5e7eb}
tr:hover{background:#1e2230}
.badge{display:inline-block;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:600}
.badge-green{background:#064e3b;color:#10b981}
.badge-red{background:#7f1d1d;color:#ef4444}
.badge-orange{background:#78350f;color:#f59e0b}
.error-banner{background:#7f1d1d;border:1px solid #ef4444;color:#ef4444;padding:14px 20px;border-radius:8px;margin-bottom:16px;font-weight:600;font-size:14px}
select,input[type="text"],input[type="date"]{background:#141720;color:#e5e7eb;border:1px solid #2d3139;border-radius:6px;padding:8px 12px;font-size:13px}
.filter-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.btn{background:#10b981;color:#0f1117;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{background:#059669}
.btn-secondary{background:#2d3139;color:#e5e7eb}
.sub-tabs{display:flex;gap:4px;margin-bottom:16px}
.sub-btn{background:#141720;border:1px solid #2d3139;color:#9ca3af;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px}
.sub-btn.active{background:#10b981;color:#0f1117;border-color:#10b981}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.75);z-index:1000;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#1a1d29;border:1px solid #2d3139;border-radius:12px;padding:24px;max-width:700px;width:95vw;max-height:80vh;overflow-y:auto;position:relative}
.modal h3{color:#10b981;margin-bottom:16px}
.modal .close{position:absolute;top:12px;right:16px;color:#9ca3af;cursor:pointer;font-size:20px;background:none;border:none}
.pagination{display:flex;gap:8px;align-items:center;margin-top:12px;justify-content:center}
.pagination button{background:#2d3139;color:#e5e7eb;border:none;padding:6px 12px;border-radius:4px;cursor:pointer}
.pagination button.active{background:#10b981;color:#0f1117}
.recon-entity{margin-bottom:16px}
.recon-acct{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#141720;border-radius:6px;margin-bottom:6px;flex-wrap:wrap;gap:8px}
.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;font-size:13px}
.info-grid .lbl{color:#9ca3af}
.info-grid .val{color:#e5e7eb;font-weight:500}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media(max-width:768px){
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .header h1{font-size:18px}
  .tab-btn{font-size:11px;padding:8px 10px}
  .kpi .value{font-size:18px}
  .filter-row{flex-direction:column}
  .filter-row select,.filter-row input{width:100%}
  .recon-acct{flex-direction:column;align-items:flex-start}
  table{font-size:11px}
  th,td{padding:6px 8px}
}
@media(max-width:480px){
  body{padding:8px}
  .kpi-grid{grid-template-columns:1fr}
  .tab-btn{font-size:10px;padding:6px 8px}
}
</style>
</head>
<body>
<div class="header">
  <h1>Peperbos Group Dashboard</h1>
  <div class="updated">Last updated: 2026-03-26</div>
</div>

<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('overview')">Group Overview</button>
  <button class="tab-btn" onclick="switchTab('entitydetail')">Entity Detail</button>
  <button class="tab-btn" onclick="switchTab('intercompany')">Intercompany</button>
  <button class="tab-btn" onclick="switchTab('spending')">Spending Tracker</button>
  <button class="tab-btn" onclick="switchTab('bankrecon')">Bank Recon</button>
  <button class="tab-btn" onclick="switchTab('incomestatement')">Income Statement</button>
  <button class="tab-btn" onclick="switchTab('cashflow')">Cash Flow</button>
  <button class="tab-btn" onclick="switchTab('bankstatements')">Bank Statements</button>
  <button class="tab-btn" onclick="switchTab('invoices')">Invoices</button>
</div>

<div id="overview" class="tab-content active">
  <div class="kpi-grid" id="kpiGrid"></div>
  <div class="grid-2">
    <div class="chart-box"><h3>Income vs Expenses by Entity</h3><canvas id="chartIncExp"></canvas></div>
    <div class="chart-box"><h3>12-Month Cash Flow Trend</h3><canvas id="chartTrend"></canvas></div>
  </div>
  <div class="grid-2">
    <div class="chart-box"><h3>Top 5 Expense Categories</h3><canvas id="chartExpCat"></canvas></div>
    <div class="card" id="dataQuality"></div>
  </div>
</div>

<div id="entitydetail" class="tab-content">
  <div class="filter-row">
    <select id="entitySelect" onchange="renderEntityDetail()">
      <option value="">Select Entity...</option>
    </select>
  </div>
  <div id="entityInfo"></div>
  <div class="sub-tabs" id="entitySubTabs">
    <button class="sub-btn active" onclick="switchEntitySub('etxns')">Transactions</button>
    <button class="sub-btn" onclick="switchEntitySub('eis')">Income Statement</button>
    <button class="sub-btn" onclick="switchEntitySub('ebs')">Balance Sheet</button>
  </div>
  <div id="etxns" class="entity-sub active"></div>
  <div id="eis" class="entity-sub" style="display:none"></div>
  <div id="ebs" class="entity-sub" style="display:none"></div>
</div>

<div id="intercompany" class="tab-content"><div class="card"><h3 style="color:#10b981;margin-bottom:12px">Intercompany Transfers</h3><div class="tbl-scroll" id="icMatrix"></div></div></div>

<div id="spending" class="tab-content">
  <div class="filter-row">
    <select id="spendEntity" onchange="renderSpending()"><option value="">All Entities</option></select>
  </div>
  <div class="grid-2">
    <div class="chart-box"><h3>Spend by Category</h3><canvas id="chartSpendCat"></canvas></div>
    <div class="chart-box"><h3>Monthly Spend by Category</h3><canvas id="chartSpendMonth"></canvas></div>
  </div>
</div>

<div id="bankrecon" class="tab-content">
  <div id="reconBanner"></div>
  <div id="reconSummary" class="card" style="margin-bottom:16px"></div>
  <div id="reconCards"></div>
</div>

<div id="incomestatement" class="tab-content">
  <div class="filter-row">
    <select id="isEntity" onchange="renderIncomeStatement()"><option value="">Select Entity...</option></select>
  </div>
  <div class="card"><div class="tbl-scroll" id="isTable"></div></div>
</div>

<div id="cashflow" class="tab-content">
  <div class="filter-row">
    <select id="cfEntity" onchange="renderCashFlow()"><option value="">All Entities</option></select>
  </div>
  <div class="kpi-grid" id="cfKpis"></div>
  <div class="chart-box"><h3>Monthly Cash Flow</h3><canvas id="chartCashFlow"></canvas></div>
</div>

<div id="bankstatements" class="tab-content">
  <div class="filter-row">
    <select id="bsEntity" onchange="renderBankStatements()"><option value="">All Entities</option></select>
    <select id="bsAccount" onchange="renderBankStatements()"><option value="">All Accounts</option></select>
  </div>
  <div class="card"><div class="tbl-scroll" id="bsTable"></div></div>
  <div class="pagination" id="bsPagination"></div>
</div>

<div id="invoices" class="tab-content">
  <div class="filter-row">
    <select id="invEntity" onchange="renderInvoices()"><option value="">All Entities</option></select>
    <button class="sub-btn active" onclick="filterInvoices('all')">All</button>
    <button class="sub-btn" onclick="filterInvoices('matched')">Matched</button>
    <button class="sub-btn" onclick="filterInvoices('unmatched')">Unmatched</button>
  </div>
  <div class="card" id="invSummary"></div>
  <div class="card"><div class="tbl-scroll" id="invTable"></div></div>
</div>

<div class="modal-overlay" id="drillModal">
  <div class="modal">
    <button class="close" onclick="closeModal()">&times;</button>
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
  </div>
</div>

function fmt(n){
  if(n==null||isNaN(n))return'R 0.00';
  try{return new Intl.NumberFormat('en-ZA',{style:'currency',currency:'ZAR'}).format(n)}
  catch(e){return'R '+Number(n).toFixed(2)}
}

function switchTab(id){
  var tabs=document.querySelectorAll('.tab-content');
  var btns=document.querySelectorAll('.tab-btn');
  for(var i=0;i<tabs.length;i++)tabs[i].classList.remove('active');
  for(var i=0;i<btns.length;i++)btns[i].classList.remove('active');
  var el=document.getElementById(id);
  if(el)el.classList.add('active');
  var allBtns=document.querySelectorAll('.tab-btn');
  for(var i=0;i<allBtns.length;i++){
    if(allBtns[i].textContent.toLowerCase().indexOf(id.substring(0,4))>-1||
       allBtns[i].getAttribute('onclick').indexOf(id)>-1)allBtns[i].classList.add('active');
  }
  renderTab(id);
}

function renderTab(id){
  if(id==='overview')renderOverview();
  else if(id==='entitydetail')renderEntityDetail();
  else if(id==='intercompany')renderIntercompany();
  else if(id==='spending')renderSpending();
  else if(id==='bankrecon')renderBankRecon();
  else if(id==='incomestatement')renderIncomeStatement();
  else if(id==='cashflow')renderCashFlow();
  else if(id==='bankstatements')renderBankStatements();
  else if(id==='invoices')renderInvoices();
}

  for(var i=0;i<subs.length;i++)subs[i].style.display='none';
  for(var i=0;i<btns.length;i++)btns[i].classList.remove('active');
  var el=document.getElementById(id);
  if(el)el.style.display='block';
  for(var i=0;i<btns.length;i++){
    if(btns[i].getAttribute('onclick').indexOf(id)>-1)btns[i].classList.add('active');
  }
}

function getEntityPnl(ent){
  var pnl=BANK_RECON.entity_pnl||{};
  return pnl[ent]||{monthly:{},ytd:{income:0,expenses:0,net:0},latest_balance:0};
}

function txnsByEntity(ent){
  return TXN.filter(function(t){return t.entity===ent});
}

function txnsByMonth(arr,m){
  return arr.filter(function(t){return(t.date||'').substring(0,7)===m});
}

function sumIncome(arr){
  var total=0;
  for(var i=0;i<arr.length;i++){
    var t=arr[i];
    if(t.amount>0&&t.category!=='Intercompany Transfer'&&t.category!=='Transfers'&&t.category!=='Loan Repayment')total+=t.amount;
  }
  return total;
}

function sumExpenses(arr){
  var total=0;
  for(var i=0;i<arr.length;i++){
    var t=arr[i];
    var amt=Math.abs(t.amount||0)+Math.abs(t.fees||0);
    if(t.amount<0&&t.category!=='Intercompany Transfer'&&t.category!=='Transfers'&&t.category!=='Loan Repayment')total+=amt;
  }
  return total;
}

window.drillKpi=function(type){
  var pnl=BANK_RECON.entity_pnl||{};
  var h='<table><tr><th>Entity</th><th style="text-align:right">Amount</th></tr>';
  var total=0;
  for(var i=0;i<ENTITY_NAMES.length;i++){
    var e=ENTITY_NAMES[i];
    var p=pnl[e]||{};
    var v=0;
    if(type==='balance')v=p.operating_balance||p.latest_balance||0;
    else if(type==='income'||type==='ytd_income')v=p.ytd?p.ytd.income:0;
    else if(type==='expenses'||type==='ytd_expenses')v=p.ytd?p.ytd.expenses:0;
    total+=v;
    h+='<tr><td>'+e+'</td><td style="text-align:right">'+fmt(v)+'</td></tr>';
  }
  h+='<tr style="font-weight:700;border-top:2px solid #2d3139"><td>TOTAL</td><td style="text-align:right">'+fmt(total)+'</td></tr></table>';
  openModal(type.replace(/_/g,' ').toUpperCase()+' by Entity',h);
};

function renderChart(canvasId,type,labels,datasets,extraOpts){
  var ctx=document.getElementById(canvasId);
  if(!ctx)return;
  if(charts[canvasId])charts[canvasId].destroy();
  var opts={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#9ca3af'}}},scales:{}};
  if(type==='bar'||type==='line'){
    opts.scales={x:{ticks:{color:'#9ca3af'},grid:{color:'#1e2230'}},y:{ticks:{color:'#9ca3af'},grid:{color:'#1e2230'}}};
  }
  if(type==='doughnut')opts.scales={};
  if(extraOpts){
    for(var k in extraOpts){
      if(k==='plugins'){for(var pk in extraOpts[k])opts.plugins[pk]=extraOpts[k][pk]}
      else if(k==='indexAxis')opts.indexAxis=extraOpts[k];
      else opts[k]=extraOpts[k];
    }
  }
  charts[canvasId]=new Chart(ctx,{type:type,data:{labels:labels,datasets:datasets},options:opts});
}

function renderEntityIS(ent){
  var etxns=txnsByEntity(ent);
  var cats={};
  for(var i=0;i<etxns.length;i++){
    var t=etxns[i];
    var cat=t.category||'Other';
    if(cat==='Intercompany Transfer'||cat==='Transfers'||cat==='Loan Repayment')continue;
    if(!cats[cat])cats[cat]={};
    var m=(t.date||'').substring(0,7);
    cats[cat][m]=(cats[cat][m]||0)+(t.amount||0)-Math.abs(t.fees||0);
  }
  var revCats=[];var expCats=[];
  for(var c in cats){
    var total=0;for(var m in cats[c])total+=cats[c][m];
    if(total>0)revCats.push(c);else expCats.push(c);
  }
  var h='<div class="tbl-scroll"><table><tr><th>Category</th>';
  for(var mi=0;mi<MONTHS.length;mi++)h+='<th style="text-align:right">'+MONTH_LABELS[mi]+'</th>';
  h+='<th style="text-align:right;font-weight:700">YTD</th></tr>';

  function addRow(cat,isRev){
    var ytd=0;
    h+='<tr><td>'+cat+'</td>';
    for(var mi=0;mi<MONTHS.length;mi++){
      var v=cats[cat]?cats[cat][MONTHS[mi]]||0:0;
      ytd+=v;
      h+='<td style="text-align:right;color:'+(v>=0?'#10b981':'#ef4444')+'">'+fmt(Math.abs(v))+'</td>';
    }
    h+='<td style="text-align:right;font-weight:700;color:'+(ytd>=0?'#10b981':'#ef4444')+'">'+fmt(Math.abs(ytd))+'</td></tr>';
    return ytd;
  }

  if(revCats.length){
    h+='<tr><td colspan="'+(MONTHS.length+2)+'" style="color:#10b981;font-weight:700;padding-top:12px">Revenue</td></tr>';
    var totalRev=0;
    for(var i=0;i<revCats.length;i++)totalRev+=addRow(revCats[i],true);
    h+='<tr style="border-top:2px solid #2d3139"><td style="font-weight:700">Total Revenue</td>';
    for(var mi=0;mi<MONTHS.length;mi++)h+='<td></td>';
    h+='<td style="text-align:right;font-weight:700;color:#10b981">'+fmt(totalRev)+'</td></tr>';
  }
  if(expCats.length){
    h+='<tr><td colspan="'+(MONTHS.length+2)+'" style="color:#ef4444;font-weight:700;padding-top:12px">Expenses</td></tr>';
    var totalExp=0;
    for(var i=0;i<expCats.length;i++)totalExp+=addRow(expCats[i],false);
    h+='<tr style="border-top:2px solid #2d3139"><td style="font-weight:700">Total Expenses</td>';
    for(var mi=0;mi<MONTHS.length;mi++)h+='<td></td>';
    h+='<td style="text-align:right;font-weight:700;color:#ef4444">'+fmt(Math.abs(totalExp))+'</td></tr>';
  }
  var net=(revCats.length?totalRev:0)+(expCats.length?totalExp:0);
  h+='<tr style="border-top:3px solid #10b981"><td style="font-weight:700;font-size:14px">NET PROFIT / LOSS</td>';
  for(var mi=0;mi<MONTHS.length;mi++)h+='<td></td>';
  h+='<td style="text-align:right;font-weight:700;font-size:14px;color:'+(net>=0?'#10b981':'#ef4444')+'">'+fmt(net)+'</td></tr>';
  h+='</table></div>';
  document.getElementById('eis').innerHTML=h;
}

function renderEntityBS(ent){
  var pnl=getEntityPnl(ent);
  var accts=BANK_RECON.accounts?BANK_RECON.accounts[ent]||{}:{};
  var cashBal=0;var mortgage=0;
  for(var a in accts){
    if(accts[a].is_mortgage)mortgage+=accts[a].statement_closing_balance||0;
    else cashBal+=accts[a].statement_closing_balance||0;
  }
  var icReceivable=0,icPayable=0;
  var etxns=txnsByEntity(ent);
  for(var i=0;i<etxns.length;i++){
    if(etxns[i].category==='Intercompany Transfer'){
      if(etxns[i].amount>0)icReceivable+=etxns[i].amount;
      else icPayable+=Math.abs(etxns[i].amount);
    }
  }
  var totalAssets=cashBal+icReceivable;
  var totalLiab=mortgage+icPayable;
  var equity=totalAssets-totalLiab;

  var h='<div class="card"><h3 style="color:#10b981;margin-bottom:12px">Balance Sheet - '+ent+'</h3>';
  h+='<table>';
  h+='<tr><td colspan="2" style="color:#10b981;font-weight:700;padding-top:8px">ASSETS</td></tr>';
  h+='<tr><td>Cash at Bank</td><td style="text-align:right">'+fmt(cashBal)+'</td></tr>';
  if(icReceivable)h+='<tr><td>Intercompany Receivables</td><td style="text-align:right">'+fmt(icReceivable)+'</td></tr>';
  h+='<tr style="border-top:2px solid #2d3139;font-weight:700"><td>Total Assets</td><td style="text-align:right">'+fmt(totalAssets)+'</td></tr>';
  h+='<tr><td colspan="2" style="color:#ef4444;font-weight:700;padding-top:12px">LIABILITIES</td></tr>';
  if(mortgage)h+='<tr><td>Mortgage Bond</td><td style="text-align:right;color:#ef4444">'+fmt(-mortgage)+'</td></tr>';
  if(icPayable)h+='<tr><td>Intercompany Payables</td><td style="text-align:right;color:#ef4444">'+fmt(-icPayable)+'</td></tr>';
  h+='<tr style="border-top:2px solid #2d3139;font-weight:700"><td>Total Liabilities</td><td style="text-align:right;color:#ef4444">'+fmt(-totalLiab)+'</td></tr>';
  h+='<tr><td colspan="2" style="color:#3b82f6;font-weight:700;padding-top:12px">EQUITY</td></tr>';
  h+='<tr><td>Retained Earnings (YTD Net P/L)</td><td style="text-align:right">'+fmt(equity)+'</td></tr>';
  h+='<tr style="border-top:3px solid #3b82f6;font-weight:700"><td>Total Equity</td><td style="text-align:right">'+fmt(equity)+'</td></tr>';
  h+='</table></div>';
  document.getElementById('ebs').innerHTML=h;
}

function renderSpending(){

  }

    monthlyCat[m][cat]=(monthlyCat[m][cat]||0)+Math.abs(t.amount);
  }
  var sorted=Object.keys(catTotals).sort(function(a,b){return catTotals[b]-catTotals[a]});
  var colors=['#10b981','#3b82f6','#f59e0b','#ef4444','#8b5cf6','#ec4899','#06b6d4','#84cc16'];
  renderChart('chartSpendCat','bar',sorted,
    [{label:'Total Spend',data:sorted.map(function(c){return catTotals[c]}),backgroundColor:colors.slice(0,sorted.length)}],
    {});

  var dsArr=[];
  for(var ci=0;ci<Math.min(sorted.length,6);ci++){
    var cat=sorted[ci];
    var data=MONTHS.map(function(m){return monthlyCat[m]?monthlyCat[m][cat]||0:0});
    dsArr.push({label:cat,data:data,backgroundColor:colors[ci]});
  }
  renderChart('chartSpendMonth','bar',MONTH_LABELS,dsArr,{scales:{x:{stacked:true,ticks:{color:'#9ca3af'},grid:{color:'#1e2230'}},y:{stacked:true,ticks:{color:'#9ca3af'},grid:{color:'#1e2230'}}}});
}

// ========== BANK RECONCILIATION ==========
function renderBankRecon(){
  var summary=BANK_RECON.summary||{};
  var accts=BANK_RECON.accounts||{};
  var mismatched=summary.mismatched||0;

  if(mismatched>0){
    document.getElementById('reconBanner').innerHTML='<div class="error-banner">&#9888; '+mismatched+' account(s) require investigation — reconciliation mismatch detected</div>';
  }else{
    document.getElementById('reconBanner').innerHTML='';
  }

  document.getElementById('reconSummary').innerHTML='<span style="color:#9ca3af">Reconciliation: </span><span style="font-weight:700;color:'+(mismatched>0?'#ef4444':'#10b981')+'">'+(summary.reconciled||0)+' of '+(summary.total_accounts||0)+' reconciled</span>'+(mismatched>0?' | <span style="color:#ef4444">'+mismatched+' require investigation</span>':'');

  var h='';
  for(var ent in accts){
    h+='<div class="recon-entity"><h3 style="color:#e5e7eb;margin-bottom:8px">'+ent+'</h3>';
    for(var acctId in accts[ent]){
      var a=accts[ent][acctId];
      var ok=a.reconciled;
      var diff=a.difference||0;
      var missing=a.missing_months||a.missing_statements_needed||[];
      h+='<div class="recon-acct">';
      h+='<div><span style="color:#9ca3af">'+(a.bank||'Bank')+' </span><span style="font-weight:600">'+acctId+'</span></div>';
      h+='<div><span style="color:#9ca3af">Statement: </span>'+fmt(a.statement_closing_balance)+'</div>';
      h+='<div><span style="color:#9ca3af">Book: </span>'+fmt(a.calculated_balance)+'</div>';
      if(!ok)h+='<div><span style="color:#9ca3af">Diff: </span><span style="color:#ef4444">'+fmt(diff)+'</span></div>';
      h+='<div>'+(ok?'<span class="badge badge-green">Reconciled</span>':'<span class="badge badge-red">Mismatch: '+fmt(diff)+'</span>')+'</div>';
      h+='<div><span style="color:#9ca3af">Latest: </span>'+(a.last_transaction_date||a.latest_statement_date||'-')+'</div>';
      if(missing.length)h+='<div><span class="badge badge-orange">Missing: '+missing.join(', ')+'</span></div>';
      h+='</div>';
    }
    h+='</div>';
  }
  document.getElementById('reconCards').innerHTML=h;
}

// ========== INCOME STATEMENT ==========
function renderIncomeStatement(){
  var sel=document.getElementById('isEntity');
  if(sel.options.length<=1){
    for(var i=0;i<ENTITY_NAMES.length;i++){var o=document.createElement('option');o.value=ENTITY_NAMES[i];o.textContent=ENTITY_NAMES[i];sel.appendChild(o)}
  }
  var ent=sel.value;
  if(!ent){document.getElementById('isTable').innerHTML='<div style="color:#9ca3af">Select an entity</div>';return}
  renderEntityIS(ent);
  document.getElementById('isTable').innerHTML=document.getElementById('eis').innerHTML;
}

// ========== CASH FLOW ==========
function renderCashFlow(){
  var sel=document.getElementById('cfEntity');
  if(sel.options.length<=1){
    for(var i=0;i<ENTITY_NAMES.length;i++){var o=document.createElement('option');o.value=ENTITY_NAMES[i];o.textContent=ENTITY_NAMES[i];sel.appendChild(o)}
  }
  var ent=sel.value;
  var filtered=ent?txnsByEntity(ent):TXN;
  var inflows=[];var outflows=[];var net=[];
  var totalIn=0,totalOut=0;
  for(var mi=0;mi<MONTHS.length;mi++){
    var mtxns=txnsByMonth(filtered,MONTHS[mi]);
    var inc=sumIncome(mtxns);
    var exp=sumExpenses(mtxns);
    inflows.push(inc);outflows.push(exp);net.push(inc-exp);
    totalIn+=inc;totalOut+=exp;
  }
  document.getElementById('cfKpis').innerHTML=
    '<div class="kpi"><div class="label">Total Inflows</div><div class="value green">'+fmt(totalIn)+'</div></div>'+
    '<div class="kpi"><div class="label">Total Outflows</div><div class="value red">'+fmt(totalOut)+'</div></div>'+
    '<div class="kpi"><div class="label">Net Cash Change</div><div class="value '+(totalIn-totalOut>=0?'green':'red')+'">'+fmt(totalIn-totalOut)+'</div></div>';

  renderChart('chartCashFlow','bar',MONTH_LABELS,
    [{label:'Inflows',data:inflows,backgroundColor:'rgba(16,185,129,0.7)',order:2},
     {label:'Outflows',data:outflows,backgroundColor:'rgba(239,68,68,0.7)',order:2},
     {label:'Net',data:net,type:'line',borderColor:'#3b82f6',backgroundColor:'transparent',tension:0.3,order:1}],
    {});
}

// ========== BANK STATEMENTS ==========
function renderBankStatements(){
  var entSel=document.getElementById('bsEntity');
  var acctSel=document.getElementById('bsAccount');
  if(entSel.options.length<=1){
    for(var i=0;i<ENTITY_NAMES.length;i++){var o=document.createElement('option');o.value=ENTITY_NAMES[i];o.textContent=ENTITY_NAMES[i];entSel.appendChild(o)}
  }
  var ent=entSel.value;
  var acct=acctSel.value;
  var filtered=TXN.slice();
  if(ent)filtered=filtered.filter(function(t){return t.entity===ent});
  if(acct)filtered=filtered.filter(function(t){return t.account===acct});
  filtered.sort(function(a,b){return(b.date||'').localeCompare(a.date||'')});

  // Update account dropdown
  if(ent){
    var accounts={};
    for(var i=0;i<TXN.length;i++)if(TXN[i].entity===ent)accounts[TXN[i].account]=true;
    acctSel.innerHTML='<option value="">All Accounts</option>';
    for(var a in accounts){var o=document.createElement('option');o.value=a;o.textContent=a;acctSel.appendChild(o)}
  }

  var perPage=50;
  var start=bsPage*perPage;
  var page=filtered.slice(start,start+perPage);
  var totalPages=Math.ceil(filtered.length/perPage);

  var h='<table><tr><th>Date</th><th>Entity</th><th>Bank</th><th>Account</th><th>Description</th><th>Debit</th><th>Credit</th><th>Balance</th><th>Category</th></tr>';
  for(var i=0;i<page.length;i++){
    var t=page[i];
    var debit=t.amount<0?Math.abs(t.amount):0;
    var credit=t.amount>0?t.amount:0;
    h+='<tr><td>'+t.date+'</td><td>'+t.entity+'</td><td>'+(t.bank||'')+'</td><td>'+(t.account||'')+'</td>';
    h+='<td>'+t.description+'</td>';
    h+='<td style="color:#ef4444">'+(debit?fmt(debit):'')+'</td>';
    h+='<td style="color:#10b981">'+(credit?fmt(credit):'')+'</td>';
    h+='<td>'+fmt(t.balance||0)+'</td>';
    h+='<td>'+(t.category||'Other')+'</td></tr>';
  }
  h+='</table>';
  document.getElementById('bsTable').innerHTML=h;

  var pg='<span style="color:#9ca3af">'+filtered.length+' transactions | Page '+(bsPage+1)+'/'+Math.max(totalPages,1)+'</span>';
  pg+=' <button onclick="bsPage=Math.max(0,bsPage-1);renderBankStatements()">&laquo; Prev</button>';
  pg+=' <button onclick="bsPage=Math.min('+(totalPages-1)+',bsPage+1);renderBankStatements()">Next &raquo;</button>';
  document.getElementById('bsPagination').innerHTML=pg;
}

// ========== INVOICES ==========
function filterInvoices(f){
  invFilter=f;
  var btns=document.querySelectorAll('#invoices .sub-btn');
  for(var i=0;i<btns.length;i++)btns[i].classList.remove('active');
  for(var i=0;i<btns.length;i++){
    if(btns[i].getAttribute('onclick').indexOf(f)>-1)btns[i].classList.add('active');
  }
  renderInvoices();
}

function renderInvoices(){
  var sel=document.getElementById('invEntity');
  if(sel.options.length<=1){
    for(var i=0;i<ENTITY_NAMES.length;i++){var o=document.createElement('option');o.value=ENTITY_NAMES[i];o.textContent=ENTITY_NAMES[i];sel.appendChild(o)}
  }
  var ent=sel.value;
  var filtered=INVOICE_DATA.slice();
  if(ent)filtered=filtered.filter(function(inv){return inv.entity===ent});
  if(invFilter==='matched')filtered=filtered.filter(function(inv){return inv.matched_to_bank});
  if(invFilter==='unmatched')filtered=filtered.filter(function(inv){return!inv.matched_to_bank});

  var matched=0,unmatched=0;
  for(var i=0;i<INVOICE_DATA.length;i++){
    if(INVOICE_DATA[i].matched_to_bank)matched++;else unmatched++;
  }
  document.getElementById('invSummary').innerHTML=
    '<span style="color:#9ca3af">Total: </span><span style="font-weight:700">'+INVOICE_DATA.length+'</span>'+
    ' | <span style="color:#10b981">Matched: '+matched+'</span>'+
    ' | <span style="color:#ef4444">Unmatched: '+unmatched+'</span>';

  var h='<table><tr><th>Entity</th><th>Filename</th><th>Invoice No.</th><th>Vendor</th><th>Type</th><th>Matched</th><th>Status</th></tr>';
  for(var i=0;i<filtered.length;i++){
    var inv=filtered[i];
    h+='<tr><td>'+inv.entity+'</td><td style="max-width:250px;overflow:hidden;text-overflow:ellipsis">'+inv.filename+'</td>';
    h+='<td>'+(inv.invoice_number||'-')+'</td><td>'+(inv.vendor||'-')+'</td>';
    h+='<td>'+(inv.file_type||'-')+'</td>';
    h+='<td>'+(inv.matched_to_bank?'<span class="badge badge-green">Yes</span>':'<span class="badge badge-red">No</span>')+'</td>';
    h+='<td>'+(inv.status||'Filed')+'</td></tr>';
  }
  h+='</table>';
  document.getElementById('invTable').innerHTML=h;
}
